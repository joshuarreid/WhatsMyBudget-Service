# Test profile: use in-memory H2 so tests don't require external DB env vars.

spring.datasource.url=jdbc:h2:mem:wmbservice;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create schema from JPA entities for context load.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Avoid MySQL-specific dialect pinning in tests
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Don't run schema.sql/data.sql in tests (we use JPA ddl-auto)
spring.sql.init.mode=never
