spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Backend-issued JWT verification key (HMAC).
          # Use a long random secret (at least 32 chars). Recommended: set via env var.
          secret: ${WMB_JWT_SECRET:change-me-to-a-long-random-secret}

wmb:
  auth:
    # Login password (BCrypt hash recommended). You can generate one with BCryptPasswordEncoder.
    # For convenience in dev, you can also set a plain password and it will be BCrypt-checked.
    # Recommended: store only the hash.
    password-hash: ${WMB_PASSWORD_HASH:}
    password: ${WMB_PASSWORD:}
    token-ttl-seconds: ${WMB_TOKEN_TTL_SECONDS:86400}
    # Login brute-force protection (in-memory, app-wide)
    max-login-attempts: ${WMB_MAX_LOGIN_ATTEMPTS:10}
    lock-seconds: ${WMB_LOGIN_LOCK_SECONDS:300}
    # How long to keep per-IP attempt state in memory (cleanup runs on each login)
    attempt-cache-ttl-seconds: ${WMB_ATTEMPT_CACHE_TTL_SECONDS:3600}

api:
  v1:
    # Runtime decommission switch for legacy /api/** endpoints.
    # Allowed values: active, deprecated, disabled
    mode: ${WMB_API_V1_MODE:active}
